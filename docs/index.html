<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="W Jezioranach">
<title>W Jezioranach - archiwum</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>W Jezioranach - archiwum</h1>
  <p class="disclaimer">
    Ta strona nie hostuje ani nie kopiuje nagrań. Wszystkie pliki dźwiękowe są strumieniowane
    bezpośrednio z serwerów Polskiego Radia. Prawa autorskie do materiałów należą do
    Polskiego Radia S.A. Źródło:
    <a href="https://www.polskieradio.pl/357/7291" target="_blank" rel="noopener">polskieradio.pl</a>
  </p>
</header>

<main>
  <section class="episode-list-panel" aria-label="Lista odcinków">
    <div class="list-controls">
      <input type="search" id="search-box" placeholder="Szukaj po numerze lub dacie...">
      <span id="episode-count" class="episode-count"></span>
    </div>

    <div id="group-grid" class="group-grid"></div>

    <div id="group-detail" class="group-detail" hidden>
      <button id="back-btn" type="button" class="back-btn">&#8592; Powrót</button>
      <ol id="episode-list" class="episode-list"></ol>
    </div>
  </section>
</main>

<div class="mini-player" aria-label="Odtwarzacz">
  <audio id="audio-player" preload="none"></audio>

  <div class="controls-row">
    <button id="skip-back-btn" type="button" class="nav-btn skip-btn" aria-label="Cofnij 10 sekund">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
        <path d="M12,4 A8,8 0 1 0 20,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <polygon points="23,10 20,15.5 17,10" fill="currentColor"/>
        <text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor">10</text>
      </svg>
    </button>
    <button id="play-pause-btn" type="button" class="nav-btn play-btn" aria-label="Odtwórz">
      <span id="icon-play" class="icon-play"></span>
      <span id="icon-pause" class="icon-pause" hidden><span></span><span></span></span>
    </button>
    <button id="skip-forward-btn" type="button" class="nav-btn skip-btn" aria-label="Przewiń 10 sekund do przodu">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
        <path d="M12,4 A8,8 0 1 1 4,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <polygon points="1,10 4,15.5 7,10" fill="currentColor"/>
        <text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor">10</text>
      </svg>
    </button>
  </div>

  <div class="seek-wrap">
    <input type="range" id="seek-bar" class="seek-bar" min="0" max="0" value="0" step="1" aria-label="Przewijanie">
    <div class="time-row">
      <span id="current-time">0:00</span>
      <span id="duration-time">0:00</span>
    </div>
  </div>

  <div class="transport">
    <button id="prev-btn" type="button" class="nav-btn" aria-label="Poprzedni odcinek">&#8249;</button>
    <div class="now-playing">
      <span id="now-playing-title">-</span>
      <span id="now-playing-date"></span>
      <button id="download-btn" type="button" class="download-btn" aria-label="Pobierz odcinek">
        <svg class="download-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M4 20h16"/>
        </svg>
        <span id="download-label" class="download-label">Pobierz</span>
      </button>
    </div>
    <button id="next-btn" type="button" class="nav-btn" aria-label="Następny odcinek">&#8250;</button>
  </div>
</div>

<script src="player.js"></script>
</body>
</html>
